[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-application-agent"
version = "0.1.0"
description = "AI-powered job application automation system"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]